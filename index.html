<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$OSCAR — the most viral AI cat on social media</title>
<meta name="description" content="$OSCAR — the most viral AI cat on social media. One bubble. Zero excitement.">
<meta name="theme-color" content="#0b1014">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="$OSCAR — not impressed. still ascending.">
<meta property="og:description" content="the most viral AI cat on social media">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#070a12; --ink2:#10141f; --steel:#9aa5b8; --steel-dim:#5a6478;
  --amber:#ff9a3c; --amber-hot:#ffd23a; --kraft:#ffd23a; --kraft-dark:#b88a12;
  --alarm:#ff3b2f; --ice:#9fd2ff; --paper:#f1ece2; --green:#9ccc3d; --post:#d6daf0; --postb:#b7c5d9; --anon:#117743;
  --stencil:"Bungee","Impact","Arial Black",sans-serif;
  --mono:"VT323","Courier New",monospace;
  --marker:"Arimo",Arial,Helvetica,sans-serif; --post-font:"Arimo",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --ink:#0b1014; } }
:root[data-theme="dark"]{ --ink:#0b1014; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);overscroll-behavior:none}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.hidden{opacity:0!important;pointer-events:none!important;visibility:hidden}
.fade{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility .7s}

/* ───── cinemascope bars ───── */
#bars::before,#bars::after{content:"";position:fixed;left:0;right:0;height:13vh;background:#000;z-index:30;transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
#bars::before{top:0} #bars::after{bottom:0}
#bars.open::before{transform:translateY(-101%)} #bars.open::after{transform:translateY(101%)}

/* ───── intro terminal ───── */
#term{position:fixed;left:max(4vw,18px);bottom:calc(13vh + 22px);z-index:31;font-size:clamp(12px,1.25vw,15px);line-height:1.65;color:var(--amber);text-shadow:0 0 8px rgba(255,179,26,.55),0 0 22px rgba(255,120,0,.25);max-width:min(620px,90vw);white-space:pre-wrap;pointer-events:none}
#term .ok{color:#9dff8a;text-shadow:0 0 10px rgba(120,255,110,.6)}
#term .bad{color:var(--alarm);text-shadow:0 0 10px rgba(255,59,47,.7)}
#term .cur{display:inline-block;width:.6em;height:1.05em;background:var(--amber);vertical-align:-2px;animation:blink .8s steps(1) infinite;box-shadow:0 0 10px var(--amber)}
@keyframes blink{50%{opacity:0}}
#rec{position:fixed;top:calc(13vh + 16px);right:max(4vw,18px);z-index:31;font-size:12px;letter-spacing:.08em;color:#ff6a5e;display:flex;gap:8px;align-items:center;pointer-events:none}
#rec i{width:10px;height:10px;border-radius:50%;background:var(--alarm);box-shadow:0 0 12px var(--alarm);animation:blink 1s steps(1) infinite}

#skip{position:fixed;right:max(4vw,18px);bottom:calc(13vh + 18px);z-index:32;background:rgba(10,14,18,.6);border:1px solid rgba(255,179,26,.5);color:var(--amber);padding:9px 16px;font-size:13px;letter-spacing:.06em;backdrop-filter:blur(6px);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#skip:hover{background:var(--amber);color:#111}
#sound{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:rgba(10,14,18,.72);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--paper);backdrop-filter:blur(8px);animation:pulse 2s ease-in-out infinite}
#sound.on{animation:none;opacity:.55;transform:translateX(-50%) scale(.9)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,179,26,.15),0 0 24px rgba(255,179,26,.35)}}

/* ───── slam title ───── */
#slam{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#slam .t{font-family:var(--stencil);font-weight:900;font-size:clamp(84px,17vw,280px);line-height:.82;letter-spacing:.01em;color:var(--paper);position:relative;text-shadow:0 0 30px rgba(255,179,26,.55),0 0 80px rgba(255,120,0,.35),0 6px 0 #000}
#slam .t::before,#slam .t::after{content:attr(data-text);position:absolute;inset:0;mix-blend-mode:screen;opacity:.85}
#slam .t::before{color:#ff2a4a;clip-path:inset(0 0 55% 0);transform:translate(-6px,0)}
#slam .t::after{color:#22e6ff;clip-path:inset(48% 0 0 0);transform:translate(6px,0)}
#slam .s{margin-top:18px;font-size:clamp(13px,1.6vw,20px);letter-spacing:.12em;color:var(--amber);text-shadow:0 0 12px rgba(255,179,26,.7)}
#slam.go .t{animation:slamIn .55s cubic-bezier(.2,1.6,.4,1) both, glitch 2.4s steps(2) .55s infinite}
#slam.go .s{animation:fadeUp .6s .35s both}
#slam.out{opacity:0;transition:opacity .5s}
@keyframes slamIn{0%{transform:scale(3.4);opacity:0;filter:blur(18px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}
@keyframes glitch{0%,86%{transform:none}88%{transform:translate(4px,-2px) skewX(-6deg)}90%{transform:translate(-5px,1px)}92%{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
#slam.sec .t{font-size:clamp(54px,9.5vw,170px)}
#slam .k{font-family:var(--mono);font-size:clamp(12px,1.2vw,15px);color:var(--steel);letter-spacing:.1em;margin-bottom:10px}

/* ───── HUD ───── */
#hud{top:calc(16px + env(safe-area-inset-top,0px));left:max(2.2vw,14px);width:250px;font-size:12px;background:linear-gradient(180deg,rgba(14,20,26,.78),rgba(10,14,18,.62));border:1px solid rgba(139,152,164,.28);backdrop-filter:blur(8px);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));padding:12px 14px 12px}
#hud h3{margin:0 0 8px;font-family:var(--stencil);font-weight:800;font-size:20px;letter-spacing:.06em;color:var(--amber);display:flex;align-items:center;gap:8px}
#hud h3 i{width:8px;height:8px;border-radius:50%;background:var(--alarm);box-shadow:0 0 10px var(--alarm);animation:blink 1.2s steps(1) infinite}
#hud dl{margin:0;display:grid;grid-template-columns:1fr auto;row-gap:4px}
#hud dt{color:var(--steel)} #hud dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--paper)}
#hud dd.hot{color:var(--alarm);text-shadow:0 0 8px rgba(255,59,47,.6)}
#hud .bar{margin:9px 0 3px;height:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
#hud .bar b{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,var(--amber) 0 6px,#d48700 6px 12px);box-shadow:0 0 10px rgba(255,179,26,.6)}
#hud .integ{display:flex;justify-content:space-between;color:var(--steel)} #hud .integ span:last-child{color:#9dff8a}
#abort{margin-top:10px;width:100%;background:rgba(255,59,47,.12);border:1px solid rgba(255,59,47,.55);color:#ff7a70;padding:7px 0;letter-spacing:.14em;font-weight:600}
#abort:hover{background:var(--alarm);color:#fff}

/* ───── test program nav ───── */
#nav{right:max(2.2vw,14px);top:50%;transform:translateY(-50%);width:210px}
#nav .hd{font-size:11px;color:var(--steel);letter-spacing:.12em;margin:0 0 10px 22px}
#nav ol{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
#nav ol::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:rgba(139,152,164,.25)}
#nav .fill{position:absolute;left:6px;top:8px;width:2px;background:var(--amber);box-shadow:0 0 10px var(--amber);height:0}
#nav li{position:relative}
#nav button{all:unset;cursor:pointer;display:block;padding:7px 0;font-size:12.5px;color:var(--steel);transition:color .25s}
#nav button b{font-weight:600;color:var(--steel-dim);margin-right:8px;font-variant-numeric:tabular-nums}
#nav li::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border:1.5px solid var(--steel-dim);background:var(--ink);transform:rotate(45deg);transition:.25s}
#nav li.done::before{background:var(--kraft);border-color:var(--kraft)}
#nav li.on::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px var(--amber)}
#nav li.on button{color:var(--paper)} #nav li.on button b{color:var(--amber)}
#nav button:hover{color:var(--paper)}
#nav .alt{margin:14px 0 0 22px;display:flex;gap:8px}
#nav .alt button{all:unset;cursor:pointer;font-size:11px;color:var(--steel);border:1px solid rgba(139,152,164,.35);padding:5px 9px;letter-spacing:.05em}
#nav .alt button:hover{color:var(--amber);border-color:var(--amber)}

/* ───── content panel ───── */
#panel{left:max(4vw,20px);bottom:max(7vh,40px);width:min(520px,44vw)}
#panel .card{position:relative}
#panel .k{font-size:12.5px;color:var(--amber);letter-spacing:.1em;margin-bottom:6px;text-shadow:0 0 10px rgba(255,179,26,.5)}
#panel h2{font-family:var(--stencil);font-weight:900;font-size:clamp(44px,5.6vw,92px);line-height:.86;margin:0 0 14px;color:var(--paper);text-shadow:0 0 24px rgba(255,179,26,.25),0 4px 0 rgba(0,0,0,.6)}
#panel p.lore{margin:0;font-size:clamp(14px,1.15vw,17px);line-height:1.6;color:#e9dfcf;max-width:46ch;background:linear-gradient(90deg,rgba(8,12,16,.72),rgba(8,12,16,.25));padding:12px 14px;border-left:3px solid var(--kraft)}
#panel .spec{margin-top:10px;font-size:12px;color:var(--steel)}
#panel.swap .card{animation:cardIn .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes cardIn{0%{opacity:0;transform:translateX(-40px) skewX(-8deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}

/* hero */
.hero h1{font-family:var(--stencil);font-weight:900;font-size:clamp(110px,15vw,240px);line-height:.78;margin:0;color:var(--paper);text-shadow:0 0 34px rgba(255,179,26,.45),0 0 90px rgba(255,140,0,.25),0 6px 0 rgba(0,0,0,.65);letter-spacing:-.01em}
.hero .tag{font-family:var(--marker);font-size:clamp(22px,2.3vw,34px);color:var(--kraft);margin:6px 0 18px;transform:rotate(-2deg);text-shadow:0 2px 0 rgba(0,0,0,.6)}
.ca{display:flex;align-items:stretch;max-width:470px;border:1px solid rgba(255,179,26,.45);background:rgba(8,12,16,.7);backdrop-filter:blur(6px)}
.ca code{flex:1;padding:12px 14px;font-size:13px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.ca button{border:0;background:var(--amber);color:#14100a;font-weight:600;padding:0 18px;letter-spacing:.06em;position:relative;overflow:hidden}
.ca button.flash{animation:flash .6s}
@keyframes flash{0%{background:#fff;box-shadow:0 0 40px #fff}100%{background:var(--amber)}}
.row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.xbtn{position:relative;display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--paper);border:1px solid rgba(239,230,214,.4);padding:11px 20px;background:rgba(8,12,16,.6);font-weight:600;letter-spacing:.05em;overflow:hidden;isolation:isolate}
.xbtn svg{width:16px;height:16px;fill:currentColor}
.xbtn::before{content:"";position:absolute;inset:-2px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--amber) 80%,#fff 85%,transparent 90%);z-index:-2;animation:spin 2.6s linear infinite}
.xbtn::after{content:"";position:absolute;inset:1px;background:#0e1419;z-index:-1}
.xbtn:hover{color:var(--amber);box-shadow:0 0 26px rgba(255,179,26,.45)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.ghost{all:unset;cursor:pointer;padding:11px 16px;border:1px dashed rgba(139,152,164,.5);color:var(--steel);font-size:13px}
.ghost:hover{color:var(--amber);border-color:var(--amber)}

/* final */
.reports{margin-top:14px;display:grid;gap:6px;max-width:470px}
.reports a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--paper);font-size:13px;padding:9px 12px;background:rgba(8,12,16,.68);border:1px solid rgba(139,152,164,.25);transition:border-color .2s,transform .2s}
.reports a span{color:var(--steel)}
.reports a:hover{border-color:var(--ice);transform:translateX(4px);box-shadow:0 0 18px rgba(166,236,255,.25)}
.final h2{color:var(--ice)!important;text-shadow:0 0 30px rgba(166,236,255,.6),0 0 80px rgba(120,200,255,.3)!important}

/* ───── lab chat ───── */
#chat{right:max(2.2vw,14px);bottom:max(4vh,22px);width:300px;font-size:12px;pointer-events:none}
#chat *{pointer-events:none}
#chat .m{background:rgba(10,14,18,.7);border-left:2px solid var(--steel-dim);padding:6px 10px;margin-top:6px;backdrop-filter:blur(6px);animation:fadeUp .35s both}
#chat .m b{color:var(--amber);font-weight:600;margin-right:6px}
#chat .m.p{border-color:var(--alarm)} #chat .m.p b{color:#ff7a70}

/* ───── speech bubble ───── */
#say{position:fixed;z-index:12;left:0;top:0;pointer-events:none;font-family:var(--marker);font-size:clamp(16px,1.5vw,21px);color:#2a1c0e;background:#e7d3b1;padding:8px 14px 9px;border-radius:3px;box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 0 0 1px rgba(90,60,30,.25);white-space:nowrap;transform:translate(-50%,-100%) rotate(-2deg);opacity:0;transition:opacity .25s}
#say::after{content:"";position:absolute;left:50%;bottom:-9px;border:9px solid transparent;border-top-color:#e7d3b1;border-bottom:0;transform:translateX(-50%)}
#say.on{opacity:1}

#hint{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--steel);letter-spacing:.1em;display:flex;align-items:center;gap:10px;pointer-events:none}
#hint i{width:18px;height:28px;border:1.5px solid var(--steel);border-radius:10px;position:relative}
#hint i::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:6px;background:var(--amber);border-radius:2px;transform:translateX(-50%);animation:wheel 1.4s infinite}
@keyframes wheel{to{transform:translate(-50%,9px);opacity:0}}

/* ───── gallery ───── */
#gallery{position:fixed;inset:0;z-index:50;background:rgba(6,9,12,.9);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:max(4vh,24px) max(4vw,18px);overflow:auto;touch-action:pan-y}
#gallery header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
#gallery h2{font-family:var(--stencil);font-weight:900;font-size:clamp(40px,5vw,72px);margin:0;color:var(--paper)}
#gallery .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
#gallery figure{margin:0;position:relative;cursor:zoom-in;background:#0e1419;border:1px solid rgba(139,152,164,.25);overflow:hidden}
#gallery figure img{display:block;width:100%;aspect-ratio:1;object-fit:cover;transition:transform .5s,filter .5s;filter:saturate(.9) contrast(1.05)}
#gallery figure:hover img{transform:scale(1.06);filter:saturate(1.1)}
#gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:var(--paper)}
.x{all:unset;cursor:pointer;font-size:14px;color:var(--steel);border:1px solid rgba(139,152,164,.4);padding:8px 14px}
.x:hover{color:var(--amber);border-color:var(--amber)}
#lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px}
#lightbox img{max-width:min(92vw,980px);max-height:78vh;box-shadow:0 0 60px rgba(255,179,26,.18);animation:lbIn .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes lbIn{from{transform:scale(.85);opacity:0}}
#lightbox .cap{font-size:13px;color:var(--steel)}
#lightbox .nv{display:flex;gap:10px}

#fallback{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#2a2016,#0b1014 70%)}
#fallback img{width:min(60vh,70vw);filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
#fallback p{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font-size:12px;color:var(--steel)}
body.nogl #fallback{display:flex}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:45;font-family:var(--stencil);font-weight:900;font-size:clamp(34px,5vw,64px);color:var(--alarm);text-shadow:0 0 24px rgba(255,59,47,.8);pointer-events:none;opacity:0;white-space:nowrap}
#toast.go{animation:toast 1.6s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

@media (max-width:760px){
  #hud{width:auto;right:auto;padding:8px 10px;font-size:10.5px;max-width:58vw}
  #hud h3{font-size:16px;margin-bottom:4px}
  #hud dl{row-gap:1px} #hud .row-x{display:none}
  #abort{padding:5px 0;margin-top:6px}
  #nav{top:auto;bottom:auto;transform:none;right:0;left:0;top:calc(10px + env(safe-area-inset-top,0px));width:auto;display:none}
  #chat{display:none}
  #panel{left:12px;right:12px;width:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px))}
  #panel h2{font-size:44px}
  #panel p.lore{font-size:13.5px;padding:9px 11px}
  .hero h1{font-size:96px}
  .hero .tag{font-size:21px;margin-bottom:12px}
  #mnav{display:flex!important}
  #hint{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #term{font-size:11.5px}
}
#mnav{display:none;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:center;gap:6px;z-index:11}
#mnav button{all:unset;width:30px;height:30px;display:grid;place-items:center;font-size:11px;color:var(--steel);border:1px solid rgba(139,152,164,.35);background:rgba(10,14,18,.7)}
#mnav button.on{color:#111;background:var(--amber);border-color:var(--amber)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ───── $PENISGUY overrides: imageboard posts + launch control ───── */
#term{color:var(--green);text-shadow:0 0 8px rgba(156,204,61,.6)}
#term .cur{background:var(--green);box-shadow:0 0 10px var(--green)}
#slam .t{letter-spacing:0;text-shadow:0 0 30px rgba(255,154,60,.6),0 0 90px rgba(255,90,0,.35),0 6px 0 #000}
#slam .s{font-family:var(--post-font);font-weight:700;color:var(--green);letter-spacing:.02em;text-transform:none}
#slam .k{font-size:clamp(16px,1.6vw,22px)}
#hud{font-size:15px} #hud dd,#hud dt{line-height:1.05} #hud h3{font-size:16px;color:var(--amber-hot)}
#nav button{font-size:16px} #nav button b{min-width:52px;display:inline-block}
.hero h1{font-size:clamp(54px,7.4vw,120px);line-height:.9;color:var(--amber-hot);text-shadow:0 0 34px rgba(255,170,40,.45),0 6px 0 rgba(0,0,0,.7)}
.hero .tag{font-family:var(--post-font);font-weight:700;color:var(--green);font-size:clamp(18px,1.7vw,24px);transform:none}
#panel h2{font-size:clamp(34px,4vw,64px);color:var(--paper)}
#panel .k{font-family:var(--mono);font-size:19px;color:var(--amber)}
#panel .spec{font-size:16px}
.post{font-family:var(--post-font);font-size:clamp(14px,1.05vw,16px);line-height:1.45;background:var(--post);color:#000;border:1px solid var(--postb);border-left:0;border-top:0;padding:8px 12px 10px;max-width:46ch;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.post .ph,#chat .ph{font-size:12.5px;margin-bottom:4px;color:#000}

  buildGallery();
  $('#navlist').insertAdjacentHTML('beforeend', SECTIONS.map((s, i) => `<li><button data-i="${i}"><b>${s.alt}</b>${s.nav}</button></li>`).join(''));
  $('#mnav').innerHTML = SECTIONS.map((s, i) => `<button data-i="${i}" aria-label="${s.nav}">${String(i).padStart(2, '0')}</button>`).join('');

  $('#skip').onclick = () => { unlockAudio(); skipIntro(); }; $('#sound').onclick = unlockAudio;
  addEventListener('resize', onResize); initInput(canvas);
  window.__BAG = { step, STORY, get BAG() { return { react: charReact }; }, skipIntro, goTo, setP(p) { STORY.P = STORY.Pt = STORY.Pprev = p; }, INTRO, CAMSTATE };
  if (!ENV.test) requestAnimationFrame(loop); window.__BAG_READY = true;
}
